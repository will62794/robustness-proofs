\* ROBUST: every program except WriteCheck.  Each updater reads only keys it writes (ACCOUNT is
\* never written), so the only vulnerable rw-edges leave the read-only Balance and can never be
\* adjacent.  Expect SerializableViaPath to HOLD.
SPECIFICATION Spec

CONSTANTS
    NumCustomers    = 2
    NumTxns         = 3
    Empty           = Empty
    EnabledTxnTypes = {"Balance", "DepositChecking", "TransactSavings", "Amalgamate"}

INVARIANT TypeOK
INVARIANT SerializableViaPath
