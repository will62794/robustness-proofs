\* NOT ROBUST: Balance + WriteCheck + TransactSavings on a single customer -- the read-only
\* transaction anomaly (Fekete, O'Neil & O'Neil).  The cycle is
\*     Balance --rw--> WriteCheck --rw--> TransactSavings --wr--> Balance
\* with WriteCheck as the pivot.  Expect SerializableViaPath to VIOLATE.
SPECIFICATION Spec

CONSTANTS
    NumCustomers    = 1
    NumTxns         = 3
    Empty           = Empty
    EnabledTxnTypes = {"Balance", "WriteCheck", "TransactSavings"}

INVARIANT TypeOK
INVARIANT SerializableViaPath
