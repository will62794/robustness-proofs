\* NOT ROBUST: RegUser + ViewUsers.
\* NumNames = 1 forces every RegUser to request the same nickname, and NumUsers = 2 lets the two
\* transactions choose different uIds, so they cannot write-conflict and instead close the
\* write-skew cycle RegUser --rw--> RegUser --rw--> RegUser.  Serializable is expected to VIOLATE.
SPECIFICATION Spec

CONSTANTS
    NumItems        = 1
    NumUsers        = 2
    NumNames        = 1
    NumTxns         = 2
    Empty           = Empty
    EnabledTxnTypes = {"RegUser", "ViewUsers"}

INVARIANT TypeOK
INVARIANT SerializableViaPath
