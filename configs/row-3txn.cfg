\* ROW granularity: VIOLATES SerializableViaPath.  New-Order and Payment share the WAREHOUSE
\* row but no column; Payment and Stock-Level share the DISTRICT row but no column.  Those two
\* false edges plus one real rw-edge close a cycle.  This is what makes `ColumnGranularity` a
\* necessary assumption of the TLAPS proof rather than a convenience.
SPECIFICATION Spec

CONSTANTS
    NumWarehouses   = 1
    NumDistricts    = 2
    NumCustomers    = 2
    NumItems        = 2
    MaxOrders       = 3
    InitOrders      = 1
    StockLevelDepth = 2
    NumTxns         = 3
    ColumnGranularity = FALSE
    Empty           = Empty
    EnabledTxnTypes = {"NewOrder", "Payment", "StockLevel"}
    NewOrderItemSets = {{1}, {1, 2}}

INVARIANT SerializableViaPath
