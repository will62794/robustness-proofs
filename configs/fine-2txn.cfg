\* Fine-grained interleaving (one read/write per step) at 2 transactions.
\* Validates that collapsing transaction bodies into a single step is sound:
\* this should reach the same verdict as the coarse model on the same parameters.
SPECIFICATION SpecFine

CONSTANTS
    NumWarehouses   = 1
    NumDistricts    = 1
    NumCustomers    = 1
    NumItems        = 1
    MaxOrders       = 2
    InitOrders      = 1
    StockLevelDepth = 2
    NumTxns         = 2
    ColumnGranularity = TRUE
    Empty           = Empty
    EnabledTxnTypes = {"NewOrder", "Payment", "StockLevel"}
    NewOrderItemSets = {{1}}

INVARIANT Serializable
INVARIANT NoReadAfterWrite
INVARIANT NoDuplicateOps
