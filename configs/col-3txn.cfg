\* Default model: column granularity (the Fekete et al. setting), the smallest instance in
\* which New-Order, Payment and Stock-Level can genuinely interfere.
SPECIFICATION Spec

CONSTANTS
    NumWarehouses   = 1
    NumDistricts    = 2
    NumCustomers    = 2
    NumItems        = 2
    MaxOrders       = 3
    InitOrders      = 1
    StockLevelDepth = 2
    NumTxns         = 3
    ColumnGranularity = TRUE
    Empty           = Empty
    EnabledTxnTypes = {"NewOrder", "Payment", "StockLevel"}
    NewOrderItemSets = {{1}, {1, 2}}

INVARIANT Serializable
INVARIANT NoReadAfterWrite
INVARIANT NoDuplicateOps
INVARIANT OrderIdsContiguous
