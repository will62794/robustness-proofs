\* ROBUST: every program except Balance.  WriteCheck still emits vulnerable rw-edges (it reads
\* SAVINGS without writing it), but nothing can emit one INTO WriteCheck: every program that
\* writes CHECKING also reads it.  No dangerous structure, so expect SerializableViaPath to HOLD.
SPECIFICATION Spec

CONSTANTS
    NumCustomers    = 2
    NumTxns         = 3
    Empty           = Empty
    EnabledTxnTypes = {"DepositChecking", "TransactSavings", "Amalgamate", "WriteCheck"}

INVARIANT TypeOK
INVARIANT SerializableViaPath
