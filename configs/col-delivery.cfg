\* Delivery breaks the TLAPS proof's H3: it reads ORDER.hdr and ORDERLINE.items
\* (both written by New-Order) without writing them.  See TPCC_Proofs.tla Part 4.
SPECIFICATION Spec

CONSTANTS
    NumWarehouses   = 1
    NumDistricts    = 2
    NumCustomers    = 2
    NumItems        = 2
    MaxOrders       = 3
    InitOrders      = 1
    StockLevelDepth = 2
    NumTxns         = 3
    ColumnGranularity = TRUE
    Empty           = Empty
    EnabledTxnTypes = {"NewOrder", "Delivery"}
    NewOrderItemSets = {{1}, {1, 2}}

INVARIANT SerializableViaPath
