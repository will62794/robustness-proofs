\* Minimal model for checking SerializableViaPath.  Smallest interesting instance:
\* one warehouse, two districts, New-Order + Payment + Stock-Level under column granularity.
SPECIFICATION Spec

CONSTANTS
    NumWarehouses   = 1
    NumDistricts    = 2
    NumCustomers    = 2
    NumItems        = 2
    MaxOrders       = 3
    InitOrders      = 1
    StockLevelDepth = 2
    NumTxns         = 3
    ColumnGranularity = TRUE
    Empty           = Empty
    EnabledTxnTypes = {"NewOrder", "Payment", "StockLevel"}
    NewOrderItemSets = {{1}, {1, 2}}

INVARIANT SerializableViaPath
